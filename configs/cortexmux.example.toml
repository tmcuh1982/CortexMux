[core]
output_dir = "./outputs"
allow_remote_hosts = false
approved_hosts = []
log_level = "INFO"

[providers.ollama]
enabled = true
base_url = "http://localhost:11434"
timeout_seconds = 120

[providers.ollama.defaults]
chat = ""
text_generation = ""
structured_output = ""
vision = ""
embedding = ""

# Remote providers are opt-in and remain blocked unless the host is explicitly
# approved under [core]. The API key is read from OPENAI_API_KEY by default.
[providers.openai]
enabled = false
base_url = "https://api.openai.com/v1"
timeout_seconds = 120
max_retries = 2
retry_base_delay_seconds = 0.25
retry_max_delay_seconds = 2
api_key_env = "OPENAI_API_KEY"

[providers.openai.defaults]
chat = ""
text_generation = ""
structured_output = ""
vision = ""
embedding = ""

[providers.comfyui]
enabled = true
base_url = "http://127.0.0.1:8188"
timeout_seconds = 600
# Contains API graphs and reusable *.cortexmux.json catalog manifests.
workflow_dir = "./workflows"
# May be a catalog name such as "text-to-image" or a direct graph path.
default_workflow = ""
model_folders = ["checkpoints"]

# Separate local application, launched only on an explicit CapitalForge chat.
[mcp.capitalforge]
enabled = false
command = "/Users/lolo/Documents/DEV/CapitalForge/.venv/bin/capitalforge"
arguments = [
  "mcp",
  "/Users/lolo/Documents/DEV/CapitalForge/configs/local/capitalforge.yaml",
  "--database",
  "/Users/lolo/Documents/DEV/CapitalForge/capitalforge.db",
]
timeout_seconds = 20
shutdown_timeout_seconds = 5
max_result_characters = 200000

# Projects may choose a named profile globally, or pass model_profile="fast"
# on an individual request. Explicit provider/model arguments still take precedence.
[routing]
active_profile = "balanced"
validate_model_availability = true

[routing.defaults]
chat_provider = "ollama"
text_generation_provider = "ollama"
structured_output_provider = "ollama"
vision_provider = "ollama"
embedding_provider = "ollama"
image_generation_provider = "comfyui"
data_analysis_provider = "data"

[routing.profiles.fast]
chat = { provider = "ollama", model = "qwen3:4b" }
text_generation = { provider = "ollama", model = "qwen3:4b" }
structured_output = { provider = "ollama", model = "qwen3:4b" }
embedding = { provider = "ollama", model = "nomic-embed-text:latest" }

[routing.profiles.balanced]
chat = { provider = "ollama", model = "qwen3:4b" }
text_generation = { provider = "ollama", model = "qwen3:4b" }
structured_output = { provider = "ollama", model = "qwen3:4b" }
vision = { provider = "ollama", model = "ministral-3:8b" }
embedding = { provider = "ollama", model = "nomic-embed-text:latest" }

# Qwen 3.6 27B defaults to a context too large for a 24 GB unified-memory Mac.
# Route options keep it fully accelerated while callers may still override them.
[routing.profiles.quality]
chat = { provider = "ollama", model = "qwen3.6:27b", options = { num_ctx = 8192, num_predict = 2048 } }
text_generation = { provider = "ollama", model = "qwen3.6:27b", options = { num_ctx = 8192, num_predict = 2048 } }
structured_output = { provider = "ollama", model = "qwen3.6:27b", options = { num_ctx = 8192, num_predict = 1024, temperature = 0 } }
vision = { provider = "ollama", model = "qwen3.6:27b", options = { num_ctx = 8192, num_predict = 1024 } }
embedding = { provider = "ollama", model = "nomic-embed-text:latest" }

[data]
engine = "auto"
max_file_size_mb = 500
max_sample_rows = 50
max_result_rows = 200
max_plan_steps = 20
max_charts = 5
max_calculation_claims = 20
math_absolute_tolerance = 1e-9
math_relative_tolerance = 1e-6

[web]
# Direct page retrieval is opt-in. Prefer an explicit production allowlist.
enabled = false
allowed_hosts = []
allowed_ports = [80, 443]
allow_private_hosts = false
timeout_seconds = 15
max_response_bytes = 2000000
max_text_characters = 100000
max_redirects = 3
max_tables = 20
max_table_rows = 1000
