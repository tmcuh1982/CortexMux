[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cortexmux"
version = "0.5.1"
description = "A modular, local-first router for AI and deterministic data-analysis tasks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CortexMux contributors" }]
keywords = ["ollama", "comfyui", "ai", "data-analysis", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
comfyui = ["websockets>=12,<16"]
data = ["numpy>=1.26", "pandas>=2.2"]
polars = ["numpy>=1.26", "pandas>=2.2", "polars>=1.0"]
duckdb = ["duckdb>=1.0", "numpy>=1.26", "pandas>=2.2"]
excel = ["openpyxl>=3.1"]
visualization = ["matplotlib>=3.8"]
yaml = ["PyYAML>=6,<7"]
all = [
  "cortexmux[comfyui,data,polars,duckdb,excel,visualization,yaml]",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "twine>=5.1",
  "types-openpyxl>=3.1",
]

[project.scripts]
cortexmux = "cortexmux.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cortexmux"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/workflows"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cortexmux"]
mypy_path = "src"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "numpy.*",
  "pandas.*",
  "polars.*",
  "duckdb.*",
  "matplotlib.*",
  "websockets.*",
  "yaml.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires explicitly enabled local services"]

[tool.coverage.run]
source = ["src/cortexmux"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
